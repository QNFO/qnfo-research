name: latex-pdf
on:
  push:
    branches: ['res/paper/v2-latex-pdf']
    paths: ['papers/**/*.tex']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Compile LaTeX papers
        shell: bash
        run: |
          set -euo pipefail
          cd papers
          shopt -s nullglob
          for tex in */*.tex; do
            d="$(dirname "$tex")"; f="$(basename "$tex")"
            (cd "$d" && tectonic "$f")
          done
      - name: Commit rendered PDFs
        run: |
          git config user.name "qnfo-actions"
          git config user.email "actions@users.noreply.github.com"
          git add papers
          if ! git diff --cached --quiet; then
            git commit -m "render(actions): LaTeX PDFs for v2-update papers"
            git push
          fi
      - name: Attach PDFs to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pdf in papers/*/*.pdf; do
            slug="$(basename "$pdf" .pdf)"
            tag="pdf-${slug}"
            gh release delete "$tag" --yes 2>/dev/null || true
            gh release create "$tag" "$pdf" --title "LaTeX PDF: $slug" --notes "Rendered by GitHub Actions (tectonic) from ${slug}.tex" 2>/dev/null || true
          done