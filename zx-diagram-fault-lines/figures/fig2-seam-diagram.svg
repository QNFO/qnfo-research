<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280">
  <rect width="560" height="280" fill="#ffffff"/>
  <!-- top import box -->
  <rect x="130" y="20" width="300" height="52" rx="6" fill="#eef3fa" stroke="#4a6da7" stroke-width="1.5"/>
  <text x="280" y="42" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#20304f">3+1-dimensional particle physics</text>
  <text x="280" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#44506b">imports: spin networks, holographic entropy</text>
  <!-- map plane band -->
  <rect x="40" y="115" width="480" height="60" fill="#f4f7f4" stroke="#1d7a4f" stroke-width="2"/>
  <text x="280" y="141" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14381f">The 2-dimensional map: the ZX diagram plane</text>
  <text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5c46">sound and complete for computation: the diagrams earn their success here</text>
  <!-- seam dashed line -->
  <line x1="40" y1="175" x2="520" y2="175" stroke="#b3261e" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="520" y="193" text-anchor="end" font-family="sans-serif" font-size="13" fill="#b3261e" font-weight="bold">THE SEAM</text>
  <!-- bottom import box -->
  <rect x="130" y="208" width="300" height="52" rx="6" fill="#faf3ee" stroke="#a76a4a" stroke-width="1.5"/>
  <text x="280" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f3020">1-dimensional thermodynamics</text>
  <text x="280" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b5038">imports: entropy, energy budgets, toy black holes</text>
  <!-- arrows -->
  <line x1="280" y1="74" x2="280" y2="112" stroke="#4a6da7" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="280" y1="206" x2="280" y2="178" stroke="#a76a4a" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#4a6da7"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#a76a4a"/></marker>
  </defs>
  <text x="280" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333333" font-style="italic">Figure 2. The seam: where the map stops being a map and starts being mistaken for territory.</text>
</svg>
