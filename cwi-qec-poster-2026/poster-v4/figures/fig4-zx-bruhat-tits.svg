<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">
  <!-- fig4: Bruhat-Tits tree (p=2, 3-regular, truncated depth 3) as ZX graph state -->
  <!-- Convention: green spider (0 in, 1 out, phase 0) = |+> ; yellow H-box (2 in, 2 out) = CZ = graph-state edge -->
  <title>Bruhat–Tits tree as ZX graph state (p=2, depth 3)</title>
  <style>
    .spider { fill: #2ecc71; stroke: #1a1a2e; stroke-width: 3; }
    .hbox   { fill: #f1c40f; stroke: #1a1a2e; stroke-width: 3; }
    .wire   { stroke: #2d3436; stroke-width: 2.5; fill: none; }
    .ring   { stroke: #95a5a6; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .lbl    { font-family: sans-serif; font-size: 12px; fill: #2d3436; }
    .lblsm  { font-family: sans-serif; font-size: 11px; fill: #636e72; }
    .lblbig { font-family: sans-serif; font-size: 15px; font-weight: bold; fill: #1a1a2e; }
  </style>
  <!-- concentric truncation rings -->
  <circle class="ring" cx="320" cy="320" r="130"/>
  <circle class="ring" cx="320" cy="320" r="225"/>
  <circle class="ring" cx="320" cy="320" r="320"/>

  <!-- EDGES (wires with CZ H-boxes at midpoints): center->tier1 -->
  <line class="wire" x1="320" y1="320" x2="367" y2="305"/>
  <rect class="hbox" x="335" y="298" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="320" x2="296" y2="279"/>
  <rect class="hbox" x="294" y="284" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="320" x2="296" y2="361"/>
  <rect class="hbox" x="294" y="352" width="14" height="14" rx="2"/>
  <!-- tier1->tier2 -->
  <line class="wire" x1="415" y1="320" x2="450" y2="272"/>
  <rect class="hbox" x="426" y="282" width="14" height="14" rx="2"/>
  <line class="wire" x1="415" y1="320" x2="450" y2="368"/>
  <rect class="hbox" x="426" y="350" width="14" height="14" rx="2"/>
  <line class="wire" x1="272.5" y1="237.7" x2="296" y2="184"/>
  <rect class="hbox" x="278" y="196" width="14" height="14" rx="2"/>
  <line class="wire" x1="272.5" y1="237.7" x2="213" y2="252"/>
  <rect class="hbox" x="230" y="230" width="14" height="14" rx="2"/>
  <line class="wire" x1="272.5" y1="402.3" x2="213" y2="388"/>
  <rect class="hbox" x="230" y="382" width="14" height="14" rx="2"/>
  <line class="wire" x1="272.5" y1="402.3" x2="296" y2="456"/>
  <rect class="hbox" x="278" y="440" width="14" height="14" rx="2"/>
  <!-- tier2->tier3 (12 edges) -->
  <line class="wire" x1="484.5" y1="225" x2="525" y2="161"/>
  <rect class="hbox" x="500" y="178" width="14" height="14" rx="2"/>
  <line class="wire" x1="484.5" y1="225" x2="552" y2="272"/>
  <rect class="hbox" x="516" y="238" width="14" height="14" rx="2"/>
  <line class="wire" x1="484.5" y1="415" x2="525" y2="479"/>
  <rect class="hbox" x="500" y="440" width="14" height="14" rx="2"/>
  <line class="wire" x1="484.5" y1="415" x2="552" y2="368"/>
  <rect class="hbox" x="516" y="382" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="130" x2="362" y2="86"/>
  <rect class="hbox" x="336" y="88" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="130" x2="278" y2="86"/>
  <rect class="hbox" x="286" y="88" width="14" height="14" rx="2"/>
  <line class="wire" x1="155.5" y1="225" x2="115" y2="161"/>
  <rect class="hbox" x="128" y="178" width="14" height="14" rx="2"/>
  <line class="wire" x1="155.5" y1="225" x2="88" y2="272"/>
  <rect class="hbox" x="110" y="238" width="14" height="14" rx="2"/>
  <line class="wire" x1="155.5" y1="415" x2="88" y2="368"/>
  <rect class="hbox" x="110" y="382" width="14" height="14" rx="2"/>
  <line class="wire" x1="155.5" y1="415" x2="115" y2="479"/>
  <rect class="hbox" x="128" y="440" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="510" x2="278" y2="554"/>
  <rect class="hbox" x="286" y="532" width="14" height="14" rx="2"/>
  <line class="wire" x1="320" y1="510" x2="362" y2="554"/>
  <rect class="hbox" x="336" y="532" width="14" height="14" rx="2"/>

  <!-- VERTICES: green spiders (|+>) -->
  <!-- center -->
  <circle class="spider" cx="320" cy="320" r="16"/>
  <!-- tier1 (3) -->
  <circle class="spider" cx="415" cy="320" r="12"/>
  <circle class="spider" cx="272.5" cy="237.7" r="12"/>
  <circle class="spider" cx="272.5" cy="402.3" r="12"/>
  <!-- tier2 (6) -->
  <circle class="spider" cx="484.5" cy="225" r="10"/>
  <circle class="spider" cx="484.5" cy="415" r="10"/>
  <circle class="spider" cx="320" cy="130" r="10"/>
  <circle class="spider" cx="155.5" cy="225" r="10"/>
  <circle class="spider" cx="155.5" cy="415" r="10"/>
  <circle class="spider" cx="320" cy="510" r="10"/>
  <!-- tier3 (12) -->
  <circle class="spider" cx="525" cy="525" r="8"/>
  <circle class="spider" cx="600" cy="395" r="8"/>
  <circle class="spider" cx="600" cy="245" r="8"/>
  <circle class="spider" cx="525" cy="115" r="8"/>
  <circle class="spider" cx="395" cy="45" r="8"/>
  <circle class="spider" cx="245" cy="45" r="8"/>
  <circle class="spider" cx="115" cy="115" r="8"/>
  <circle class="spider" cx="40" cy="245" r="8"/>
  <circle class="spider" cx="40" cy="395" r="8"/>
  <circle class="spider" cx="115" cy="525" r="8"/>
  <circle class="spider" cx="245" cy="595" r="8"/>
  <circle class="spider" cx="395" cy="595" r="8"/>

  <!-- LABELS -->
  <text class="lblbig" x="320" y="40" text-anchor="middle">Bruhat–Tits tree T₂ (truncated, depth 3) as a ZX graph state</text>
  <text class="lbl" x="320" y="60" text-anchor="middle">● green spider = |+⟩ · ■ yellow H-box = CZ edge · p=2 ⇒ (p+1)=3-regular branching</text>
  <text class="lblsm" x="320" y="628" text-anchor="middle">Stabilizers = Pauli webs of the diagram — same construction language as Wan–Price–Yao, holographic codes on tree-like tessellations (arXiv:2601.04467)</text>
  <text class="lblsm" x="320" y="616" text-anchor="middle"></text>
</svg>
