<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- FIGURE 2 (Panel 2): Hierarchical environmental nesting.
       Shor [[9,1,3]] logical qubit at center; spectator environment qubits
       clustered into nested fragments along Bruhat-Tits-tree boundaries.
       SVG rendering of the fixed TikZ Figure 2 (coordinate-only version). -->

  <!-- Concentric hierarchical boundaries (fragment rings) -->
  <circle cx="320" cy="320" r="130" fill="rgba(0,100,255,0.04)" stroke="#95a5a6" stroke-dasharray="7 5" stroke-width="1.6"/>
  <circle cx="320" cy="320" r="225" fill="rgba(0,100,255,0.06)" stroke="#7f8c8d" stroke-dasharray="7 5" stroke-width="1.6"/>
  <circle cx="320" cy="320" r="320" fill="rgba(0,100,255,0.08)" stroke="#636e72" stroke-dasharray="7 5" stroke-width="1.6"/>

  <!-- Edges: tier2 -> tier3 -->
  <g stroke="#95a5a6" stroke-width="1.8">
    <line x1="484.5" y1="225" x2="600" y2="245"/><line x1="484.5" y1="225" x2="525" y2="115"/>
    <line x1="484.5" y1="415" x2="525" y2="525"/><line x1="484.5" y1="415" x2="600" y2="395"/>
    <line x1="320" y1="130" x2="395" y2="45"/><line x1="320" y1="130" x2="245" y2="45"/>
    <line x1="155.5" y1="225" x2="115" y2="115"/><line x1="155.5" y1="225" x2="40" y2="245"/>
    <line x1="155.5" y1="415" x2="40" y2="395"/><line x1="155.5" y1="415" x2="115" y2="525"/>
    <line x1="320" y1="510" x2="245" y2="595"/><line x1="320" y1="510" x2="395" y2="595"/>
  </g>

  <!-- Edges: tier1 -> tier2 -->
  <g stroke="#aab7c4" stroke-width="2.2">
    <line x1="415" y1="320" x2="484.5" y2="225"/><line x1="415" y1="320" x2="484.5" y2="415"/>
    <line x1="272.5" y1="237.7" x2="320" y2="130"/><line x1="272.5" y1="237.7" x2="155.5" y2="225"/>
    <line x1="272.5" y1="402.3" x2="155.5" y2="415"/><line x1="272.5" y1="402.3" x2="320" y2="510"/>
  </g>

  <!-- Edges: center -> tier1 -->
  <g stroke="#8395a7" stroke-width="2.8">
    <line x1="320" y1="320" x2="415" y2="320"/>
    <line x1="320" y1="320" x2="272.5" y2="237.7"/>
    <line x1="320" y1="320" x2="272.5" y2="402.3"/>
  </g>

  <!-- Tier 3 environment qubits (outer ring) -->
  <g fill="#f5c6ba" stroke="#2d3436" stroke-width="1.4">
    <circle cx="525" cy="525" r="10"/><circle cx="600" cy="395" r="10"/><circle cx="600" cy="245" r="10"/>
    <circle cx="525" cy="115" r="10"/><circle cx="395" cy="45" r="10"/><circle cx="245" cy="45" r="10"/>
    <circle cx="115" cy="115" r="10"/><circle cx="40" cy="245" r="10"/><circle cx="40" cy="395" r="10"/>
    <circle cx="115" cy="525" r="10"/><circle cx="245" cy="595" r="10"/><circle cx="395" cy="595" r="10"/>
  </g>

  <!-- Tier 2 environment qubits (middle ring) -->
  <g fill="#eb9d8c" stroke="#2d3436" stroke-width="1.6">
    <circle cx="484.5" cy="225" r="13"/><circle cx="484.5" cy="415" r="13"/>
    <circle cx="320" cy="130" r="13"/><circle cx="155.5" cy="225" r="13"/>
    <circle cx="155.5" cy="415" r="13"/><circle cx="320" cy="510" r="13"/>
  </g>

  <!-- Tier 1 environment qubits (inner ring) -->
  <g fill="#e17055" stroke="#2d3436" stroke-width="1.8">
    <circle cx="415" cy="320" r="16"/><circle cx="272.5" cy="237.7" r="16"/><circle cx="272.5" cy="402.3" r="16"/>
  </g>

  <!-- Central logical hub: Shor code -->
  <circle cx="320" cy="320" r="58" fill="#2d6cdf" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="320" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Shor</text>
  <text x="320" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">[[9,1,3]]</text>

  <!-- Fragment boundary annotation -->
  <line x1="512" y1="86" x2="487" y2="152" stroke="#636e72" stroke-width="1.4"/>
  <text x="516" y="82" text-anchor="middle" font-size="11" fill="#636e72" font-family="Segoe UI, Arial, sans-serif">Fragment Boundary (p+1)</text>

  <!-- Bottom label -->
  <text x="320" y="615" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d6cdf" font-family="Segoe UI, Arial, sans-serif">Hierarchical Environmental Fragments</text>
</svg>
