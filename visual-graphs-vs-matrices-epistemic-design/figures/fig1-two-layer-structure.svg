<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
  <rect width="560" height="240" fill="#ffffff"/>
  <!-- top layer: human-auditable canonical fragment -->
  <rect x="40" y="25" width="480" height="60" rx="6" fill="#f0f6f0" stroke="#1d7a4f" stroke-width="2"/>
  <text x="280" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14381f">Human-auditable canonical fragment</text>
  <text x="280" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a5c46">normal forms: shape fixed, properties checkable by inspection</text>
  <!-- bottom layer: automated optimizer -->
  <rect x="40" y="155" width="480" height="60" rx="6" fill="#f6f1ec" stroke="#a76a4a" stroke-width="2"/>
  <text x="280" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f3020">Automated optimizer</text>
  <text x="280" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b5038">synthesis, rewriting, architecture search: trades auditability for optimality</text>
  <!-- interface band -->
  <rect x="40" y="112" width="480" height="26" fill="#fbf6e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="280" y="129" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6b4e00" font-weight="bold">THE INTERFACE - where audit remains possible</text>
  <!-- arrows -->
  <line x1="280" y1="86" x2="280" y2="110" stroke="#1d7a4f" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="280" y1="154" x2="280" y2="140" stroke="#a76a4a" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1d7a4f"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#a76a4a"/></marker>
  </defs>
  <text x="280" y="233" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333333" font-style="italic">Figure 1. The two-layer structure: where comprehension and optimality diverge, the field splits the difference.</text>
</svg>
